# プッシュやプルリクエストのたびに、自動でテストを実行する
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: GoReleaser の設定チェック
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check
